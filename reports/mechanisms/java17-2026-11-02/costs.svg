/title></path><circle cx="1353.2010" cy="859" r="5" fill="#e9b96e" stroke="#e9b96e" stroke-width="2"><title>704.006</title></circle><circle cx="1353.2011" cy="869" r="5" fill="#0b1521" stroke="#e9b96e" stroke-width="2"><title>704.006</title></circle><text x="56" y="981" fill="#b8cbd1" font-size="19" font-weight="400" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">3 x 1 s warmup + 5 x 1 s measurement / fork; fixed 256 MiB heap; exact per-operation checks.</text><text x="56" y="1018" fill="#b8cbd1" font-size="18" font-weight="400" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">CPU and allocation include the JVM and harness. This is neither p99 nor framework-exclusive allocation.</text><text x="56" y="1055" fill="#b8cbd1" font-size="18" font-weight="400" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Copy excludes source construction, SEDA queueing, completion synchronization and route execution.</text><metadata id="ominicat-mechanism-source">{"generatorSha256": "b2b0cf17e6a27bf2af4e7ecf7639e03423531ba740cc94ebf24b1d58522664de", "measurementManifestSha256": "0e662a47b7de49b2f55d21a9093c6e2cd0fd06785bb3b4c22c839a64b4e0bc1b", "summarySha256": "92749cb3d4db78bc1f8f976d920d0be238ad5292f58832988da3ab9e5fcf4e53"}</metadata></svg>
