<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1110" viewBox="0 0 1680 1110" role="img" aria-labelledby="title desc"><title id="title">Controlled mechanisms: execution, handoff and Exchange copying</title><desc id="desc">Java 17 on one Ubuntu 24.04 host. Four path cells share the same four-stage result oracle; two copy cells use one prepared Exchange. Dots are independent fork means; lines span all measured iteration means, not confidence intervals. Component costs are not additive explanations of SEDA.</desc><rect width="1680" height="1110" rx="22" fill="#0b1521" /><text x="56" y="57" fill="#64d8c3" font-size="15" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">OMINICAT / CONTROLLED EVIDENCE</text><text x="56" y="113" fill="#edf5fb" font-size="38" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Measure the mechanism, keep the contract.</text><text x="56" y="155" fill="#b8cbd1" font-size="20" font-weight="400" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Ubuntu 24.04 / Java 17 / same JAR / four stages / one request in flight</text><text x="56" y="198" fill="#b8cbd1" font-size="19" font-weight="400" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Two fresh forks per cell; dots retain both means and whiskers retain every measured iteration.</text><text x="56" y="272" fill="#64d8c3" font-size="14" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">PUBLIC SYNCHRONOUS PATH / SHARED HANDOFF</text><text x="56" y="710" fill="#e9b96e" font-size="14" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">PREBUILT EXCHANGE COMPONENT / SEPARATE SCOPE</text><rect x="40" y="311" width="1600" height="66" rx="10" fill="#112330" /><rect x="56" y="326" width="3" height="36" rx="1" fill="#64d8c3" /><text x="73" y="350" fill="#e4edf8" font-size="16" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">OminiCat / caller</text><rect x="40" y="393" width="1600" height="66" rx="10" fill="#101d2a" /><rect x="56" y="408" width="3" height="36" rx="1" fill="#76adf7" /><text x="73" y="432" fill="#e4edf8" font-size="16" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Camel / caller</text><rect x="40" y="475" width="1600" height="66" rx="10" fill="#112330" /><rect x="56" y="490" width="3" height="36" rx="1" fill="#64d8c3" /><text x="73" y="514" fill="#e4edf8" font-size="16" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">OminiCat / common FIFO</text><rect x="40" y="557" width="1600" height="66" rx="10" fill="#101d2a" /><rect x="56" y="572" width="3" height="36" rx="1" fill="#76adf7" /><text x="73" y="596" fill="#e4edf8" font-size="16" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Camel / common FIFO</text><rect x="40" y="749" width="1600" height="66" rx="10" fill="#112330" /><rect x="56" y="764" width="3" height="36" rx="1" fill="#9badc2" /><text x="73" y="788" fill="#e4edf8" font-size="16" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Identity / prepared Exchange</text><rect x="40" y="831" width="1600" height="66" rx="10" fill="#101d2a" /><rect x="56" y="846" width="3" height="36" rx="1" fill="#e9b96e" /><text x="73" y="870" fill="#e4edf8" font-size="16" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Correlated copy / prepared Exchange</text><text x="390" y="234" fill="#edf5fb" font-size="18" font-weight="700" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Wall time / ns per operation</text><text x="390" y="258" fill="#b8cbd1" font-size="15" font-weight="400" font-family="Arial,Helvetica,DejaVu Sans,sans-serif">Log scale</text><path d="M390.0000 294 V 910" stroke="#294052" stroke-width="1" /><text x="390.0" y="933" fill="#b8cbd1" font-size="13" font-weight="400" font-family="Arial,Helvetica,DejaVu Sans,sans-serif" text-anchor="middle">10</text><path d="M477.5000 294 V 910" stroke="#294052" stroke-width="1" /