<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
<title id="title">OminiCat — Bounded work, explicit ownership</title>
<desc id="desc">Each session owns its queue, live async handles and fresh processor instances. Queue capacity and async-handle capacity are separate limits using the same configured C. Optional parallel branches have fixed workers, a bounded task queue and per-branch output-reference limits. Netty accounts pending output payload bytes separately. Interruption fences old generations; cancellation remains cooperative.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#64d8c3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#76adf7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#e9b96e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9badc2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1440" height="100%" rx="22" fill="url(#background)"/>
<rect width="1440" height="100%" rx="22" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,DejaVu Sans,sans-serif">
<text x="56" y="55" font-size="14" font-weight="700" fill="#64d8c3" letter-spacing="2">OMINICAT / ARCHITECTURE</text>
<text x="1384" y="55" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end" letter-spacing="2">03 / OWNERSHIP</text>
<text x="56" y="111" font-size="40" font-weight="700" fill="#e4edf8">Bounded work, explicit ownership</text>
<text x="56" y="150" font-size="19" font-weight="400" fill="#9badc2">Independent limits protect each boundary; cancellation separates session generations.</text>
<rect x="56" y="194" width="1328" height="86" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="226" font-size="13" font-weight="700" fill="#e9b96e" letter-spacing="1.2">CONTAINER ADMISSION</text>
<text x="80" y="255" font-size="21" font-weight="700" fill="#e4edf8">Connections + sessions are capped</text>
<text x="662" y="227" font-size="18" font-weight="700" fill="#e9b96e">M = maxFrameBytes</text>
<text x="662" y="255" font-size="17" font-weight="400" fill="#9badc2">Frame-size checks and per-connection outbound accounting are separate.</text>
<rect x="56" y="318" width="742" height="590" rx="18" fill="#0e202d" stroke="#365463" stroke-width="1.2"/>
<text x="80" y="358" font-size="27" font-weight="700" fill="#e4edf8">Session A</text>
<text x="80" y="389" font-size="18" font-weight="400" fill="#9badc2">Fresh pipeline + privately owned processor instances</text>
<rect x="80" y="423" width="304" height="113" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="80" y="441" width="3" height="77" rx="1.5" fill="#64d8c3"/>
<text x="102" y="457" font-size="21" font-weight="700" fill="#e4edf8">Pending work ≤ C</text>
<text x="102" y="486" font-size="15" font-weight="400" fill="#9badc2">External + continuation items</text>
<text x="102" y="511" font-size="15" font-weight="400" fill="#9badc2">ReentrantLock + ArrayDeque</text>
<rect x="410" y="423" width="364" height="113" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="410" y="441" width="3" height="77" rx="1.5" fill="#76adf7"/>
<text x="432" y="457" font-size="21" font-weight="700" fill="#e4edf8">Live async operations ≤ C</text>
<text x="432" y="486" font-size="16" font-weight="400" fill="#9badc2">Independent limit; same configured C</text>
<text x="432" y="511" font-size="16" font-weight="400" fill="#9badc2">tryEmit → same FIFO at nextStage</text>
<path d="M410 480H384" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="80" y="576" width="694" height="76" rx="12" fill="#153039" stroke="#3e8f85" stroke-width="1.2"/>
<text x="102" y="608" font-size="23" font-weight="700" fill="#e4edf8">One serial session worker</text>
<text x="102" y="635" font-size="17" font-weight="400" fill="#9badc2">Stage calls · cancellation handles · reset hooks · reverse cleanup</text>
<path d="M232 536V576" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="232" cy="536" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<rect x="80" y="692" width="694" height="192" rx="12" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="100" y="722" font-size="17" font-weight="700" fill="#76adf7">OPTIONAL ParallelProcessor</text>
<rect x="100" y="741" width="278" height="100" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="100" y="759" width="3" height="64" rx="1.5" fill="#76adf7"/>
<text x="122" y="775" font-size="20" font-weight="700" fill="#e4edf8">P branch workers</text>
<text x="122" y="804" font-size="15" font-weight="400" fill="#9badc2">P-slot task queue</text>
<text x="122" y="829" font-size="15" font-weight="400" fill="#9badc2">≤ B output references / branch</text>
<rect x="422" y="741" width="330" height="100" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="422" y="759" width="3" height="64" rx="1.5" fill="#76adf7"/>
<text x="444" y="775" font-size="20" font-weight="700" fill="#e4edf8">Ordered join</text>
<text x="444" y="804" font-size="16" font-weight="400" fill="#9badc2">All branches succeed first</text>
<text x="444" y="829" font-size="16" font-weight="400" fill="#9badc2">Owner emits in declared order</text>
<path d="M378 791H422" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M232 652V692" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" stroke-dasharray="6 6"/>
<text x="100" y="865" font-size="15" font-weight="400" fill="#9badc2">Shared deadline: branch scheduling / wait. Join delivery may run longer.</text>
<rect x="836" y="318" width="548" height="218" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<text x="860" y="358" font-size="27" font-weight="700" fill="#e4edf8">Session B</text>
<text x="860" y="389" font-size="18" font-weight="400" fill="#9badc2">A separate ownership boundary</text>
<rect x="860" y="417" width="182" height="56" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="881" y="452" font-size="20" font-weight="700" fill="#64d8c3">Own FIFO</text>
<rect x="1090" y="417" width="270" height="56" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="1111" y="452" font-size="20" font-weight="700" fill="#e4edf8">Own worker + stages</text>
<path d="M1042 445H1090" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="1042" cy="445" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<text x="860" y="510" font-size="17" font-weight="400" fill="#9badc2">Own async handles. No mutable stages shared with A.</text>
<rect x="836" y="576" width="548" height="332" rx="15" fill="#111d2e" stroke="#715b42" stroke-width="1.2"/>
<text x="860" y="615" font-size="25" font-weight="700" fill="#e4edf8">Netty output boundary</text>
<text x="860" y="646" font-size="18" font-weight="400" fill="#9badc2">Encode → reserve → writeAndFlush</text>
<rect x="860" y="684" width="500" height="91" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="860" y="702" width="3" height="55" rx="1.5" fill="#e9b96e"/>
<text x="882" y="718" font-size="23" font-weight="700" fill="#e4edf8">Pending payload bytes ≤ 4 × M</text>
<text x="882" y="747" font-size="16" font-weight="400" fill="#9badc2">Also check channel writability before each write</text>
<path d="M774 614H816V729H860" fill="none" stroke="#e9b96e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<circle cx="774" cy="614" r="4" fill="#0b1220" stroke="#e9b96e" stroke-width="1.5"/>
<text x="860" y="811" font-size="17" font-weight="400" fill="#9badc2">Release reservation on write-future completion.</text>
<text x="860" y="840" font-size="17" font-weight="400" fill="#9badc2">Overload closes the connection explicitly.</text>
<text x="860" y="877" font-size="16" font-weight="400" fill="#e9b96e">Payload budget ≠ all Netty tasks or native memory.</text>
<rect x="56" y="946" width="1328" height="102" rx="14" fill="#17282f" stroke="#3e686b" stroke-width="1.2"/>
<text x="80" y="979" font-size="23" font-weight="700" fill="#e4edf8">Interrupt advances the generation</text>
<text x="80" y="1012" font-size="18" font-weight="700" fill="#64d8c3">Invalidate old work</text>
<path d="M273 1006H318" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="340" y="1012" font-size="18" font-weight="400" fill="#e4edf8">Drop queue + interrupt I/O</text>
<path d="M610 1006H655" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="677" y="1012" font-size="18" font-weight="400" fill="#e4edf8">Reset before next generation</text>
<path d="M963 1006H1008" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="1030" y="1012" font-size="18" font-weight="700" fill="#76adf7">Reject stale callbacks</text>
<text x="56" y="1080" font-size="17" font-weight="400" fill="#9badc2">Cancellation is cooperative. Frame-count limits are not byte/RSS limits; started external effects cannot be undone.</text>
<path d="M56 1107H1384" fill="none" stroke="#9badc2" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="1135" font-size="14" font-weight="400" fill="#9badc2">03 / C: session capacity · P: branch count · B: per-branch output reference limit</text>
<text x="1384" y="1135" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end">P = 1…64 · no durable or atomic external commit</text>
</g>
</svg>
