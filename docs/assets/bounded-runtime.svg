<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" aria-labelledby="title desc" role="img" viewBox="0 0 1440 1180"><title id="title">OminiCat — Bounded work, explicit ownership</title><desc id="desc">Each session owns its queue, live async handles and fresh processor instances. Queue capacity and async-handle capacity are separate limits using the same configured C. Optional parallel branches have fixed workers, a bounded task queue and per-branch output-reference limits. Netty accounts pending output payload bytes separately. Interruption fences old generations; cancellation remains cooperative.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern><marker id="arrow-teal" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-blue" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-amber" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-muted" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker></defs><rect width="1440" height="100%" fill="url(#background)" rx="22"/><rect width="1440" height="100%" fill="url(#dots)" rx="22"/><g font-family="Arial,Helvetica,DejaVu Sans,sans-serif"><text x="56" y="55" fill="#64d8c3" font-size="14" font-weight="700" letter-spacing="2">OMINICAT / ARCHITECTURE</text><text x="1384" y="55" fill="#9badc2" font-size="14" font-weight="400" letter-spacing="2" text-anchor="end">03 / OWNERSHIP</text><text x="56" y="111" fill="#e4edf8" font-size="40" font-weight="700">Bounded work, explicit ownership</text><text x="56" y="150" fill="#9badc2" font-size="19" font-weight="400">Independent limits protect each boundary; cancellation separates session generations.</text><rect width="1328" height="86" x="56" y="194" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="226" fill="#e9b96e" font-size="13" font-weight="700" letter-spacing="1.2">CONTAINER ADMISSION</text><text x="80" y="255" fill="#e4edf8" font-size="21" font-weight="700">Connections + sessions are capped</text><text x="662" y="227" fill="#e9b96e" font-size="18" font-weight="700">M = maxFrameBytes</text><text x="662" y="255" fill="#9badc2" font-size="17" font-weight="400">Frame-size checks and per-connection outbound accounting are separate.</text><rect width="742" height="590" x="56" y="318" fill="#0e202d" stroke="#365463" stroke-width="1.2" rx="18"/><text x="80" y="358" fill="#e4edf8" font-size="27" font-weight="700">Session A</text><text x="80" y="389" fill="#9badc2" font-size="18" font-weight="400">Fresh pipeline + privately owned processor instances</text><rect width="304" height="113" x="80" y="423" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="77" x="80" y="441" fill="#64d8c3" rx="1.5"/><text x="102" y="457" fill="#e4edf8" font-size="21" font-weight="700">Pending work ≤ C</text><text x="102" y="486" fill="#9badc2" font-size="15" font-weight="400">External + continuation items</text><text x="102" y="511" fill="#9badc2" font-size="15" font-weight="400">ReentrantLock + ArrayDeque</text><rect width="364" height="113" x="410" y="423" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="77" x="410" y="441" fill="#76adf7" rx="1.5"/><text x="432" y="457" fill="#e4edf8" font-size="21" font-weight="700">Live async operations ≤ C</text><text x="432" y="486" fill="#9badc2" font-size="16" font-weight="400">Independent limit; same configured C</text><text x="432" y="511" fill="#9badc2" font-size="16" font-weight="400">tryEmit → same FIFO at nextStage</text><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M410 480H384"/><rect width="694" height="76" x="80" y="576" fill="#153039" stroke="#3e8f85" stroke-width="1.2" rx="12"/><text x="102" y="608" fill="#e4edf8" font-size="23" font-weight="700">One serial session worker</text><text x="102" y="635" fill="#9badc2" font-size="17" font-weight="400">Stage calls · cancellation handles · reset hooks · reverse cleanup</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M232 536V576"/><circle cx="232" cy="536" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><rect width="694" height="192" x="80" y="692" fill="#111d2e" stroke="#2a3f53" stroke-dasharray="6 6" stroke-width="1.2" rx="12"/><text x="100" y="722" fill="#76adf7" font-size="17" font-weight="700">OPTIONAL ParallelProcessor</text><rect width="278" height="100" x="100" y="741" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="64" x="100" y="759" fill="#76adf7" rx="1.5"/><text x="122" y="775" fill="#e4edf8" font-size="20" font-weight="700">P branch workers</text><text x="122" y="804" fill="#9badc2" font-size="15" font-weight="400">P-slot task queue</text><text x="122" y="829" fill="#9badc2" font-size="15" font-weight="400">≤ B output references / branch</text><rect width="330" height="100" x="422" y="741" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="64" x="422" y="759" fill="#76adf7" rx="1.5"/><text x="444" y="775" fill="#e4edf8" font-size="20" font-weight="700">Ordered join</text><text x="444" y="804" fill="#9badc2" font-size="16" font-weight="400">All branches succeed first</text><text x="444" y="829" fill="#9badc2" font-size="16" font-weight="400">Owner emits in declared order</text><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M378 791H422"/><path fill="none" stroke="#76adf7" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M232 652V692"/><text x="100" y="865" fill="#9badc2" font-size="15" font-weight="400">Shared deadline: branch scheduling / wait. Join delivery may run longer.</text><rect width="548" height="218" x="836" y="318" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="860" y="358" fill="#e4edf8" font-size="27" font-weight="700">Session B</text><text x="860" y="389" fill="#9badc2" font-size="18" font-weight="400">A separate ownership boundary</text><rect width="182" height="56" x="860" y="417" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="881" y="452" fill="#64d8c3" font-size="20" font-weight="700">Own FIFO</text><rect width="270" height="56" x="1090" y="417" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="1111" y="452" fill="#e4edf8" font-size="20" font-weight="700">Own worker + stages</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M1042 445H1090"/><circle cx="1042" cy="445" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><text x="860" y="510" fill="#9badc2" font-size="17" font-weight="400">Own async handles. No mutable stages shared with A.</text><rect width="548" height="332" x="836" y="576" fill="#111d2e" stroke="#715b42" stroke-width="1.2" rx="15"/><text x="860" y="615" fill="#e4edf8" font-size="25" font-weight="700">Netty output boundary</text><text x="860" y="646" fill="#9badc2" font-size="18" font-weight="400">Encode → reserve → writeAndFlush</text><rect width="500" height="91" x="860" y="684" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="55" x="860" y="702" fill="#e9b96e" rx="1.5"/><text x="882" y="718" fill="#e4edf8" font-size="23" font-weight="700">Pending payload bytes ≤ 4 × M</text><text x="882" y="747" fill="#9badc2" font-size="16" font-weight="400">Also check channel writability before each write</text><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-amber)" d="M774 614H816V729H860"/><circle cx="774" cy="614" r="4" fill="#0b1220" stroke="#e9b96e" stroke-width="1.5"/><text x="860" y="811" fill="#9badc2" font-size="17" font-weight="400">Release reservation on write-future completion.</text><text x="860" y="840" fill="#9badc2" font-size="17" font-weight="400">Overload closes the connection explicitly.</text><text x="860" y="877" fill="#e9b96e" font-size="16" font-weight="400">Payload budget ≠ all Netty tasks or native memory.</text><rect width="1328" height="102" x="56" y="946" fill="#17282f" stroke="#3e686b" stroke-width="1.2" rx="14"/><text x="80" y="979" fill="#e4edf8" font-size="23" font-weight="700">Interrupt advances the generation</text><text x="80" y="1012" fill="#64d8c3" font-size="18" font-weight="700">Invalidate old work</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M273 1006H318"/><text x="340" y="1012" fill="#e4edf8" font-size="18" font-weight="400">Drop queue + interrupt I/O</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M610 1006H655"/><text x="677" y="1012" fill="#e4edf8" font-size="18" font-weight="400">Reset before next generation</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M963 1006H1008"/><text x="1030" y="1012" fill="#76adf7" font-size="18" font-weight="700">Reject stale callbacks</text><text x="56" y="1080" fill="#9badc2" font-size="17" font-weight="400">Cancellation is cooperative. Frame-count limits are not byte/RSS limits; started external effects cannot be undone.</text><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width=".6" d="M56 1107H1384"/><text x="56" y="1135" fill="#9badc2" font-size="14" font-weight="400">03 / C: session capacity · P: branch count · B: per-branch output reference limit</text><text x="1384" y="1135" fill="#9badc2" font-size="14" font-weight="400" text-anchor="end">P = 1…64 · no durable or atomic external commit</text></g></svg>