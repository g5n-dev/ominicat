<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" aria-labelledby="title desc" role="img" viewBox="0 0 1440 930"><title id="title">OminiCat — The microkernel, in context</title><desc id="desc">Two entry points compose a JDK-only typed-frame microkernel. Optional conversation and provider modules implement the processor SPI. The optional server reads YAML, discovers factories at startup and creates fresh pipeline instances per WebSocket session; HTTP UI and diagnostics do not create pipelines.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern><marker id="arrow-teal" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-blue" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-amber" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-muted" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker></defs><rect width="1440" height="100%" fill="url(#background)" rx="22"/><rect width="1440" height="100%" fill="url(#dots)" rx="22"/><g font-family="Arial,Helvetica,DejaVu Sans,sans-serif"><text x="56" y="55" fill="#64d8c3" font-size="14" font-weight="700" letter-spacing="2">OMINICAT / ARCHITECTURE</text><text x="1384" y="55" fill="#9badc2" font-size="14" font-weight="400" letter-spacing="2" text-anchor="end">01 / COMPOSITION</text><text x="56" y="111" fill="#e4edf8" font-size="40" font-weight="700">The microkernel, in context</text><text x="56" y="150" fill="#9badc2" font-size="19" font-weight="400">A small Java kernel. Optional conversation, provider and transport modules.</text><text x="56" y="190" fill="#9badc2" font-size="13" font-weight="700" letter-spacing="1.6">ENTRY POINTS</text><text x="1052" y="190" fill="#9badc2" font-size="13" font-weight="700" letter-spacing="1.6">OPTIONAL MODULES</text><rect width="312" height="126" x="56" y="210" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="90" x="56" y="228" fill="#76adf7" rx="1.5"/><text x="78" y="244" fill="#e4edf8" font-size="21" font-weight="700">Java embedding</text><text x="78" y="273" fill="#9badc2" font-size="17" font-weight="400">Construct stages in Java</text><text x="78" y="298" fill="#9badc2" font-size="17" font-weight="400">Direct calls or a session</text><rect width="88" height="29" x="259" y="223" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="271" y="243" fill="#76adf7" font-size="13" font-weight="700" letter-spacing=".6">EMBED</text><rect width="312" height="158" x="56" y="370" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="122" x="56" y="388" fill="#e9b96e" rx="1.5"/><text x="78" y="404" fill="#e4edf8" font-size="21" font-weight="700">Standalone container</text><text x="78" y="433" fill="#9badc2" font-size="16" font-weight="400">ominicat-server</text><text x="78" y="458" fill="#9badc2" font-size="16" font-weight="400">Netty NIO · HTTP / WebSocket</text><text x="78" y="483" fill="#9badc2" font-size="16" font-weight="400">Edge codecs · auth · admission</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M368 273H420"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M368 448H420"/><circle cx="368" cy="273" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><circle cx="368" cy="448" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><rect width="584" height="354" x="420" y="210" fill="#112b32" stroke="#3e8f85" stroke-width="1.2" rx="18"/><text x="448" y="254" fill="#e4edf8" font-size="29" font-weight="700">ominicat-core</text><rect width="114" height="29" x="862" y="230" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="874" y="250" fill="#64d8c3" font-size="13" font-weight="700" letter-spacing=".6">JDK ONLY</text><text x="448" y="284" fill="#9badc2" font-size="18" font-weight="400">Open frames · envelopes · processor SPI</text><rect width="86" height="29" x="448" y="308" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="460" y="328" fill="#64d8c3" font-size="13" font-weight="700" letter-spacing=".6">TEXT</text><rect width="90" height="29" x="544" y="308" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="556" y="328" fill="#64d8c3" font-size="13" font-weight="700" letter-spacing=".6">AUDIO</text><rect width="88" height="29" x="644" y="308" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="656" y="328" fill="#64d8c3" font-size="13" font-weight="700" letter-spacing=".6">IMAGE</text><rect width="130" height="29" x="742" y="308" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="754" y="328" fill="#64d8c3" font-size="13" font-weight="700" letter-spacing=".6">TRANSCRIPT</text><rect width="94" height="29" x="882" y="308" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="894" y="328" fill="#64d8c3" font-size="13" font-weight="700" letter-spacing=".6">CUSTOM</text><rect width="250" height="116" x="448" y="365" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="80" x="448" y="383" fill="#64d8c3" rx="1.5"/><text x="470" y="399" fill="#e4edf8" font-size="20" font-weight="700">Processor contracts</text><text x="470" y="428" fill="#9badc2" font-size="16" font-weight="400">Processor / AsyncProcessor</text><text x="470" y="453" fill="#9badc2" font-size="16" font-weight="400">Zero, one or many outputs</text><rect width="252" height="116" x="724" y="365" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="80" x="724" y="383" fill="#64d8c3" rx="1.5"/><text x="746" y="399" fill="#e4edf8" font-size="20" font-weight="700">Pipeline + session</text><text x="746" y="428" fill="#9badc2" font-size="16" font-weight="400">Direct dispatch or FIFO</text><text x="746" y="453" fill="#9badc2" font-size="16" font-weight="400">One owner per session</text><text x="448" y="522" fill="#64d8c3" font-size="17" font-weight="400">Scheduling · cancellation · composition · reverse cleanup</text><rect width="332" height="140" x="1052" y="210" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="104" x="1052" y="228" fill="#76adf7" rx="1.5"/><text x="1074" y="244" fill="#e4edf8" font-size="21" font-weight="700">ominicat-conversation</text><text x="1074" y="273" fill="#9badc2" font-size="17" font-weight="400">Transcript windows · prompts</text><text x="1074" y="298" fill="#9badc2" font-size="17" font-weight="400">Evaluations · step flows</text><rect width="332" height="140" x="1052" y="388" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="104" x="1052" y="406" fill="#76adf7" rx="1.5"/><text x="1074" y="422" fill="#e4edf8" font-size="21" font-weight="700">ominicat-providers</text><text x="1074" y="451" fill="#9badc2" font-size="16" font-weight="400">PCM tools · transcript gate</text><text x="1074" y="476" fill="#9badc2" font-size="16" font-weight="400">Compatible HTTP model adapters</text><path fill="none" stroke="#76adf7" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M1052 280H1028V394H1004"/><path fill="none" stroke="#76adf7" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M1052 458H1004"/><text x="1011" y="375" fill="#76adf7" font-size="12" font-weight="700">SPI</text><circle cx="1004" cy="394" r="4" fill="#0b1220" stroke="#76adf7" stroke-width="1.5"/><circle cx="1004" cy="458" r="4" fill="#0b1220" stroke="#76adf7" stroke-width="1.5"/><rect width="1328" height="130" x="56" y="606" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="635" fill="#e9b96e" font-size="13" font-weight="700" letter-spacing="1.4">OPTIONAL SERVER ASSEMBLY</text><text x="80" y="668" fill="#e4edf8" font-size="23" font-weight="700">YAML + ServiceLoader / registered factories</text><text x="80" y="696" fill="#9badc2" font-size="17" font-weight="400">Discover factories at startup. New stages per WebSocket session.</text><rect width="396" height="88" x="962" y="627" fill="#142536" stroke="#365463" stroke-width="1.2" rx="12"/><text x="984" y="660" fill="#64d8c3" font-size="20" font-weight="700">New WS session → new pipeline</text><text x="984" y="688" fill="#9badc2" font-size="17" font-weight="400">Fresh stateful processor instances</text><path fill="none" stroke="#e9b96e" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-amber)" d="M212 528V606"/><path fill="none" stroke="#76adf7" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M962 627H934V564"/><text x="947" y="593" fill="#76adf7" font-size="14" font-weight="400">creates</text><text x="56" y="785" fill="#64d8c3" font-size="16" font-weight="400">Solid arrows: typed-frame entry</text><text x="455" y="785" fill="#76adf7" font-size="16" font-weight="400">Dashed arrows: assembly / SPI relationship</text><text x="56" y="817" fill="#9badc2" font-size="18" font-weight="400">Embedding can construct processors directly; YAML is not required by the kernel.</text><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width=".6" d="M56 857H1384"/><text x="56" y="885" fill="#9badc2" font-size="14" font-weight="400">01 / The dependency boundary</text><text x="1384" y="885" fill="#9badc2" font-size="14" font-weight="400" text-anchor="end">Transport and model adapters stay optional</text></g></svg>