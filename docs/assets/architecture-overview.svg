<rect x="724" y="383" width="3" height="80" rx="1.5" fill="#64d8c3"/>
<text x="746" y="399" font-size="20" font-weight="700" fill="#e4edf8">Pipeline + session</text>
<text x="746" y="428" font-size="16" font-weight="400" fill="#9badc2">Direct dispatch or FIFO</text>
<text x="746" y="453" font-size="16" font-weight="400" fill="#9badc2">One owner per session</text>
<text x="448" y="522" font-size="17" font-weight="400" fill="#64d8c3">Scheduling · cancellation · composition · reverse cleanup</text>
