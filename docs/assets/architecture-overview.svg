<text x="56" y="885" font-size="14" font-weight="400" fill="#9badc2">01 / The dependency boundary</text>
<text x="1384" y="885" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end">Transport and model adapters stay optional</text>
</g>
