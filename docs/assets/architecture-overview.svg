<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
<title id="title">OminiCat — The microkernel, in context</title>
<desc id="desc">Two entry points compose a JDK-only typed-frame microkernel. Optional conversation and provider modules implement the processor SPI. The optional server reads YAML, discovers factories at startup and creates fresh pipeline instances per WebSocket session; HTTP UI and diagnostics do not create pipelines.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#64d8c3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#76adf7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#e9b96e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9badc2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1440" height="100%" rx="22" fill="url(#background)"/>
<rect width="1440" height="100%" rx="22" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,DejaVu Sans,sans-serif">
<text x="56" y="55" font-size="14" font-weight="700" fill="#64d8c3" letter-spacing="2">OMINICAT / ARCHITECTURE</text>
<text x="1384" y="55" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end" letter-spacing="2">01 / COMPOSITION</text>
<text x="56" y="111" font-size="40" font-weight="700" fill="#e4edf8">The microkernel, in context</text>
<text x="56" y="150" font-size="19" font-weight="400" fill="#9badc2">A small Java kernel. Optional conversation, provider and transport modules.</text>
<text x="56" y="190" font-size="13" font-weight="700" fill="#9badc2" letter-spacing="1.6">ENTRY POINTS</text>
<text x="1052" y="190" font-size="13" font-weight="700" fill="#9badc2" letter-spacing="1.6">OPTIONAL MODULES</text>
<rect x="56" y="210" width="312" height="126" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="56" y="228" width="3" height="90" rx="1.5" fill="#76adf7"/>
<text x="78" y="244" font-size="21" font-weight="700" fill="#e4edf8">Java embedding</text>
<text x="78" y="273" font-size="17" font-weight="400" fill="#9badc2">Construct stages in Java</text>
<text x="78" y="298" font-size="17" font-weight="400" fill="#9badc2">Direct calls or a session</text>
