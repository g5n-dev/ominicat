<text x="80" y="668" font-size="23" font-weight="700" fill="#e4edf8">YAML + ServiceLoader / registered factories</text>
<text x="80" y="696" font-size="17" font-weight="400" fill="#9badc2">Discover factories at startup. New stages per WebSocket session.</text>
<rect x="962" y="627" width="396" height="88" rx="12" fill="#142536" stroke="#365463" stroke-width="1.2"/>
<text x="984" y="660" font-size="20" font-weight="700" fill="#64d8c3">New WS session → new pipeline</text>
<text x="984" y="688" font-size="17" font-weight="400" fill="#9badc2">Fresh stateful processor instances</text>
<path d="M212 528V606" fill="none" stroke="#e9b96e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="6 6"/>
<path d="M962 627H934V564" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" stroke-dasharray="6 6"/>
<text x="947" y="593" font-size="14" font-weight="400" fill="#76adf7">creates</text>
<text x="56" y="785" font-size="16" font-weight="400" fill="#64d8c3">Solid arrows: typed-frame entry</text>
<text x="455" y="785" font-size="16" font-weight="400" fill="#76adf7">Dashed arrows: assembly / SPI relationship</text>
<text x="56" y="817" font-size="18" font-weight="400" fill="#9badc2">Embedding can construct processors directly; YAML is not required by the kernel.</text>
