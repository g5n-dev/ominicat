<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" aria-labelledby="title desc" role="img" viewBox="0 0 1440 1070"><title id="title">OminiCat — Typed frames, two execution paths</title><desc id="desc">Direct dispatch is synchronous on the caller thread. A session admits typed frames to a bounded FIFO and runs stages on one worker. AsyncEmitter callbacks enqueue continuations into the same FIFO at the next stage; callback threads do not run downstream stages. JSON codecs remain at the network edge.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern><marker id="arrow-teal" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-blue" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-amber" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-muted" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker></defs><rect width="1440" height="100%" fill="url(#background)" rx="22"/><rect width="1440" height="100%" fill="url(#dots)" rx="22"/><g font-family="Arial,Helvetica,DejaVu Sans,sans-serif"><text x="56" y="55" fill="#64d8c3" font-size="14" font-weight="700" letter-spacing="2">OMINICAT / ARCHITECTURE</text><text x="1384" y="55" fill="#9badc2" font-size="14" font-weight="400" letter-spacing="2" text-anchor="end">02 / EXECUTION</text><text x="56" y="111" fill="#e4edf8" font-size="40" font-weight="700">Typed frames, two execution paths</text><text x="56" y="150" fill="#9badc2" font-size="19" font-weight="400">Choose caller-thread dispatch or a bounded session with a single owner worker.</text><rect width="1328" height="72" x="56" y="194" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="224" fill="#e9b96e" font-size="13" font-weight="700" letter-spacing="1.2">OPTIONAL NETWORK EDGE</text><text x="80" y="249" fill="#e4edf8" font-size="18" font-weight="700">Netty NIO · WebSocket frames</text><rect width="164" height="29" x="413" y="215" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="425" y="235" fill="#e9b96e" font-size="13" font-weight="700" letter-spacing=".6">DECODE / ENCODE</text><text x="613" y="238" fill="#9badc2" font-size="19" font-weight="400">WebSocket JSON at the edge; HTTP UI / diagnostics stay separate.</text><rect width="1328" height="194" x="56" y="302" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="340" fill="#76adf7" font-size="19" font-weight="700">01</text><text x="132" y="340" fill="#e4edf8" font-size="25" font-weight="700">Direct / synchronous</text><text x="132" y="370" fill="#9badc2" font-size="18" font-weight="400">Pipeline.process(frame, sink)</text><rect width="184" height="29" x="1175" y="320" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="1187" y="340" fill="#76adf7" font-size="13" font-weight="700" letter-spacing=".6">CALLER THREAD</text><rect width="198" height="56" x="104" y="393" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="126" y="429" fill="#e4edf8" font-size="20" font-weight="700">Typed input</text><rect width="250" height="56" x="362" y="393" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="384" y="429" fill="#e4edf8" font-size="20" font-weight="700">Processor 1</text><rect width="250" height="56" x="672" y="393" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="694" y="429" fill="#e4edf8" font-size="20" font-weight="700">Processor 2</text><rect width="354" height="56" x="982" y="393" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="1004" y="429" fill="#e4edf8" font-size="20" font-weight="700">FrameSink</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M302 421H362"/><circle cx="302" cy="421" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M612 421H672"/><circle cx="612" cy="421" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M922 421H982"/><circle cx="922" cy="421" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><text x="104" y="478" fill="#76adf7" font-size="17" font-weight="400">Same call stack · synchronous emissions · no session queue</text><rect width="1328" height="364" x="56" y="530" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="568" fill="#64d8c3" font-size="19" font-weight="700">02</text><text x="132" y="568" fill="#e4edf8" font-size="25" font-weight="700">Queued / session owned</text><text x="132" y="598" fill="#9badc2" font-size="18" font-weight="400">openSession(...) → trySubmit(frame)</text><rect width="208" height="29" x="1152" y="550" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="7"/><text x="1164" y="570" fill="#64d8c3" font-size="13" font-weight="700" letter-spacing=".6">ONE OWNER WORKER</text><rect width="170" height="91" x="80" y="654" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="55" x="80" y="672" fill="#64d8c3" rx="1.5"/><text x="102" y="688" fill="#e4edf8" font-size="19" font-weight="700">Typed input</text><text x="102" y="717" fill="#9badc2" font-size="15" font-weight="400">Driver / application</text><rect width="220" height="91" x="298" y="654" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="55" x="298" y="672" fill="#64d8c3" rx="1.5"/><text x="320" y="688" fill="#e4edf8" font-size="20" font-weight="700">Bounded FIFO</text><text x="320" y="717" fill="#9badc2" font-size="15" font-weight="400">External + continuation</text><rect width="566" height="131" x="568" y="632" fill="#112b32" stroke="#3e8f85" stroke-width="1.2" rx="15"/><text x="588" y="657" fill="#64d8c3" font-size="14" font-weight="700">SESSION WORKER · dispatch by nextStage</text><rect width="164" height="61" x="588" y="675" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="603" y="713" fill="#e4edf8" font-size="18" font-weight="700">Processor</text><rect width="164" height="61" x="784" y="675" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="799" y="713" fill="#e4edf8" font-size="18" font-weight="700">Async stage</text><rect width="134" height="61" x="980" y="675" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="995" y="713" fill="#e4edf8" font-size="18" font-weight="700">Next stage</text><rect width="178" height="91" x="1182" y="654" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="55" x="1182" y="672" fill="#64d8c3" rx="1.5"/><text x="1204" y="688" fill="#e4edf8" font-size="20" font-weight="700">FrameSink</text><text x="1204" y="717" fill="#9badc2" font-size="16" font-weight="400">Typed output</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M250 700H298"/><circle cx="250" cy="700" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M518 700H568"/><circle cx="518" cy="700" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M752 705H784"/><path fill="none" stroke="#76adf7" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M948 705H980"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M1134 700H1182"/><circle cx="1134" cy="700" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/><text x="963" y="778" fill="#76adf7" font-size="13" font-weight="400">after FIFO re-entry</text><rect width="330" height="72" x="784" y="794" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="36" x="784" y="812" fill="#76adf7" rx="1.5"/><text x="806" y="828" fill="#e4edf8" font-size="19" font-weight="700">Provider callback</text><text x="806" y="857" fill="#9badc2" font-size="16" font-weight="400">AsyncEmitter.tryEmit(frame)</text><path fill="none" stroke="#76adf7" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M866 736V794"/><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M784 830H409V745"/><text x="437" y="817" fill="#76adf7" font-size="16" font-weight="400">Same FIFO + originating generation</text><text x="80" y="878" fill="#9badc2" font-size="17" font-weight="400">Callback threads enqueue. The owner worker alone enters downstream stages.</text><text x="56" y="935" fill="#9badc2" font-size="18" font-weight="400">Decode + stage creation: Netty I/O. Normal processing + encode: session worker.</text><text x="56" y="965" fill="#9badc2" font-size="18" font-weight="400">Audio / image construction snapshots input bytes; frames stay typed between stages.</text><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width=".6" d="M56 997H1384"/><text x="56" y="1025" fill="#9badc2" font-size="14" font-weight="400">02 / Solid: execution or admission · blue: callback handoff / continuation</text><text x="1384" y="1025" fill="#9badc2" font-size="14" font-weight="400" text-anchor="end">WorkerThreads: platform on 17 · virtual on 21+</text></g></svg>