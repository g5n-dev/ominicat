<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img" aria-labelledby="title desc">
<title id="title">OminiCat — Typed frames, two execution paths</title>
<desc id="desc">Direct dispatch is synchronous on the caller thread. A session admits typed frames to a bounded FIFO and runs stages on one worker. AsyncEmitter callbacks enqueue continuations into the same FIFO at the next stage; callback threads do not run downstream stages. JSON codecs remain at the network edge.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#64d8c3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#76adf7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#e9b96e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9badc2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1440" height="100%" rx="22" fill="url(#background)"/>
<rect width="1440" height="100%" rx="22" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,DejaVu Sans,sans-serif">
<text x="56" y="55" font-size="14" font-weight="700" fill="#64d8c3" letter-spacing="2">OMINICAT / ARCHITECTURE</text>
<text x="1384" y="55" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end" letter-spacing="2">02 / EXECUTION</text>
<text x="56" y="111" font-size="40" font-weight="700" fill="#e4edf8">Typed frames, two execution paths</text>
<text x="56" y="150" font-size="19" font-weight="400" fill="#9badc2">Choose caller-thread dispatch or a bounded session with a single owner worker.</text>
<rect x="56" y="194" width="1328" height="72" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="224" font-size="13" font-weight="700" fill="#e9b96e" letter-spacing="1.2">OPTIONAL NETWORK EDGE</text>
<text x="80" y="249" font-size="18" font-weight="700" fill="#e4edf8">Netty NIO · WebSocket frames</text>
<rect x="413" y="215" width="164" height="29" rx="7" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="425" y="235" font-size="13" font-weight="700" fill="#e9b96e" letter-spacing="0.6">DECODE / ENCODE</text>
<text x="613" y="238" font-size="19" font-weight="400" fill="#9badc2">WebSocket JSON at the edge; HTTP UI / diagnostics stay separate.</text>
<rect x="56" y="302" width="1328" height="194" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="340" font-size="19" font-weight="700" fill="#76adf7">01</text>
<text x="132" y="340" font-size="25" font-weight="700" fill="#e4edf8">Direct / synchronous</text>
<text x="132" y="370" font-size="18" font-weight="400" fill="#9badc2">Pipeline.process(frame, sink)</text>
<rect x="1175" y="320" width="184" height="29" rx="7" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="1187" y="340" font-size="13" font-weight="700" fill="#76adf7" letter-spacing="0.6">CALLER THREAD</text>
<rect x="104" y="393" width="198" height="56" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="126" y="429" font-size="20" font-weight="700" fill="#e4edf8">Typed input</text>
<rect x="362" y="393" width="250" height="56" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="384" y="429" font-size="20" font-weight="700" fill="#e4edf8">Processor 1</text>
<rect x="672" y="393" width="250" height="56" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="694" y="429" font-size="20" font-weight="700" fill="#e4edf8">Processor 2</text>
<rect x="982" y="393" width="354" height="56" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="1004" y="429" font-size="20" font-weight="700" fill="#e4edf8">FrameSink</text>
<path d="M302 421H362" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="302" cy="421" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<path d="M612 421H672" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="612" cy="421" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<path d="M922 421H982" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="922" cy="421" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<text x="104" y="478" font-size="17" font-weight="400" fill="#76adf7">Same call stack · synchronous emissions · no session queue</text>
<rect x="56" y="530" width="1328" height="364" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="568" font-size="19" font-weight="700" fill="#64d8c3">02</text>
<text x="132" y="568" font-size="25" font-weight="700" fill="#e4edf8">Queued / session owned</text>
<text x="132" y="598" font-size="18" font-weight="400" fill="#9badc2">openSession(...) → trySubmit(frame)</text>
<rect x="1152" y="550" width="208" height="29" rx="7" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="1164" y="570" font-size="13" font-weight="700" fill="#64d8c3" letter-spacing="0.6">ONE OWNER WORKER</text>
<rect x="80" y="654" width="170" height="91" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="80" y="672" width="3" height="55" rx="1.5" fill="#64d8c3"/>
<text x="102" y="688" font-size="19" font-weight="700" fill="#e4edf8">Typed input</text>
<text x="102" y="717" font-size="15" font-weight="400" fill="#9badc2">Driver / application</text>
<rect x="298" y="654" width="220" height="91" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="298" y="672" width="3" height="55" rx="1.5" fill="#64d8c3"/>
<text x="320" y="688" font-size="20" font-weight="700" fill="#e4edf8">Bounded FIFO</text>
<text x="320" y="717" font-size="15" font-weight="400" fill="#9badc2">External + continuation</text>
<rect x="568" y="632" width="566" height="131" rx="15" fill="#112b32" stroke="#3e8f85" stroke-width="1.2"/>
<text x="588" y="657" font-size="14" font-weight="700" fill="#64d8c3">SESSION WORKER · dispatch by nextStage</text>
<rect x="588" y="675" width="164" height="61" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="603" y="713" font-size="18" font-weight="700" fill="#e4edf8">Processor</text>
<rect x="784" y="675" width="164" height="61" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="799" y="713" font-size="18" font-weight="700" fill="#e4edf8">Async stage</text>
<rect x="980" y="675" width="134" height="61" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="995" y="713" font-size="18" font-weight="700" fill="#e4edf8">Next stage</text>
<rect x="1182" y="654" width="178" height="91" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="1182" y="672" width="3" height="55" rx="1.5" fill="#64d8c3"/>
<text x="1204" y="688" font-size="20" font-weight="700" fill="#e4edf8">FrameSink</text>
<text x="1204" y="717" font-size="16" font-weight="400" fill="#9badc2">Typed output</text>
<path d="M250 700H298" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="250" cy="700" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<path d="M518 700H568" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="518" cy="700" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<path d="M752 705H784" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M948 705H980" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" stroke-dasharray="6 6"/>
<path d="M1134 700H1182" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="1134" cy="700" r="4" fill="#0b1220" stroke="#64d8c3" stroke-width="1.5"/>
<text x="963" y="778" font-size="13" font-weight="400" fill="#76adf7">after FIFO re-entry</text>
<rect x="784" y="794" width="330" height="72" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="784" y="812" width="3" height="36" rx="1.5" fill="#76adf7"/>
<text x="806" y="828" font-size="19" font-weight="700" fill="#e4edf8">Provider callback</text>
<text x="806" y="857" font-size="16" font-weight="400" fill="#9badc2">AsyncEmitter.tryEmit(frame)</text>
<path d="M866 736V794" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" stroke-dasharray="6 6"/>
<path d="M784 830H409V745" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="437" y="817" font-size="16" font-weight="400" fill="#76adf7">Same FIFO + originating generation</text>
<text x="80" y="878" font-size="17" font-weight="400" fill="#9badc2">Callback threads enqueue. The owner worker alone enters downstream stages.</text>
<text x="56" y="935" font-size="18" font-weight="400" fill="#9badc2">Decode + stage creation: Netty I/O. Normal processing + encode: session worker.</text>
<text x="56" y="965" font-size="18" font-weight="400" fill="#9badc2">Audio / image construction snapshots input bytes; frames stay typed between stages.</text>
<path d="M56 997H1384" fill="none" stroke="#9badc2" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="1025" font-size="14" font-weight="400" fill="#9badc2">02 / Solid: execution or admission · blue: callback handoff / continuation</text>
<text x="1384" y="1025" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end">WorkerThreads: platform on 17 · virtual on 21+</text>
</g>
</svg>
