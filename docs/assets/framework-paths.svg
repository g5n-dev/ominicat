<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc">
<title id="title">OminiCat — Three frameworks, three execution paths</title>
<desc id="desc">OminiCat uses one session FIFO then same-worker synchronous calls. Camel uses one SEDA queue, Exchange copy and route processors, with completion acknowledgment. Pipecat uses queued application processors with two queues and two processing tasks per stage; source and sink use direct mode. Different native acknowledgment paths remain in measured whole-loop throughput. This is a source-backed topology, not an optimization ablation.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#64d8c3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#76adf7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#e9b96e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9badc2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1440" height="100%" rx="22" fill="url(#background)"/>
<rect width="1440" height="100%" rx="22" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,DejaVu Sans,sans-serif">
<text x="56" y="55" font-size="14" font-weight="700" fill="#64d8c3" letter-spacing="2">OMINICAT / ARCHITECTURE</text>
<text x="1384" y="55" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end" letter-spacing="2">04 / COMPARED PATHS</text>
<text x="56" y="111" font-size="40" font-weight="700" fill="#e4edf8">Three frameworks, three execution paths</text>
<text x="56" y="150" font-size="19" font-weight="400" fill="#9badc2">The actual synchronous numeric adapters: native queued APIs, one outstanding frame.</text>
<rect x="56" y="190" width="1328" height="64" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="229" font-size="14" font-weight="700" fill="#64d8c3">PINNED MODES</text>
<text x="260" y="229" font-size="20" font-weight="400" fill="#e4edf8">Java 17 platform workers  /  CPython 3.12 asyncio  /  N = 1, 4, 16</text>
<rect x="56" y="286" width="1328" height="182" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="322" font-size="26" font-weight="700" fill="#64d8c3">OminiCat</text>
<text x="342" y="322" font-size="19" font-weight="400" fill="#9badc2">PipelineSession · one owner for the synchronous chain</text>
<rect x="80" y="347" width="160" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="96" y="382" font-size="19" font-weight="700" fill="#e4edf8">Input frame</text>
<rect x="284" y="347" width="190" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="300" y="382" font-size="19" font-weight="700" fill="#e4edf8">Session FIFO</text>
<rect x="518" y="347" width="502" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="534" y="382" font-size="19" font-weight="700" fill="#e4edf8">Worker: P1 → P2 → … → PN</text>
<rect x="1064" y="347" width="296" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="1080" y="382" font-size="19" font-weight="700" fill="#e4edf8">Terminal + ack</text>
<path d="M240 375H284" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M474 375H518" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M1020 375H1064" fill="none" stroke="#64d8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="80" y="443" font-size="18" font-weight="400" fill="#9badc2">No queue between synchronous stages. Generation checks, scoped sinks and allocations remain.</text>
<rect x="56" y="500" width="1328" height="182" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="536" font-size="26" font-weight="700" fill="#e9b96e">Apache Camel 4.22.2</text>
<text x="440" y="536" font-size="19" font-weight="400" fill="#9badc2">One SEDA ingress · general Exchange / route machinery</text>
<rect x="80" y="561" width="238" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="96" y="596" font-size="19" font-weight="700" fill="#e4edf8">Request + Exchange</text>
<rect x="362" y="561" width="190" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="378" y="596" font-size="19" font-weight="700" fill="#e4edf8">SEDA queue</text>
<rect x="596" y="561" width="424" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="612" y="596" font-size="19" font-weight="700" fill="#e4edf8">Route: P1 → P2 → … → PN</text>
<rect x="1064" y="561" width="296" height="55" rx="15" fill="#142536" stroke="#2a3f53" stroke-width="1.2"/>
<text x="1080" y="596" font-size="19" font-weight="700" fill="#e4edf8">Completion + reply</text>
<path d="M318 589H362" fill="none" stroke="#e9b96e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M552 589H596" fill="none" stroke="#e9b96e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M1020 589H1064" fill="none" stroke="#e9b96e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="80" y="657" font-size="18" font-weight="400" fill="#9badc2">Exchange copy + request/reply synchronization per request; not one SEDA queue per stage.</text>
<rect x="56" y="714" width="1328" height="238" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<text x="80" y="750" font-size="26" font-weight="700" fill="#76adf7">Pipecat 1.15.0</text>
<text x="360" y="750" font-size="19" font-weight="400" fill="#9badc2">Queued application processors · enable_direct_mode=False</text>
<rect x="80" y="788" width="220" height="106" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="80" y="806" width="3" height="70" rx="1.5" fill="#76adf7"/>
<text x="102" y="822" font-size="19" font-weight="700" fill="#e4edf8">Worker input FIFO</text>
<text x="102" y="851" font-size="16" font-weight="400" fill="#9badc2">Native PipelineWorker</text>
<text x="102" y="876" font-size="16" font-weight="400" fill="#9badc2">Source / sink: direct</text>
<rect x="344" y="788" width="776" height="106" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="344" y="806" width="3" height="70" rx="1.5" fill="#76adf7"/>
<text x="366" y="822" font-size="21" font-weight="700" fill="#e4edf8">Application stage 1 → … → application stage N</text>
<text x="366" y="851" font-size="17" font-weight="400" fill="#9badc2">Each: input queue → input task → FrameQueue → process task</text>
<text x="366" y="876" font-size="17" font-weight="400" fill="#9badc2">Native Frame + immutable numeric-payload adapter</text>
<rect x="1164" y="788" width="196" height="106" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
<rect x="1164" y="806" width="3" height="70" rx="1.5" fill="#76adf7"/>
<text x="1186" y="822" font-size="19" font-weight="700" fill="#e4edf8">Output event</text>
<text x="1186" y="851" font-size="14" font-weight="400" fill="#9badc2">Async event handler</text>
<text x="1186" y="876" font-size="14" font-weight="400" fill="#9badc2">Caller acknowledgment</text>
<path d="M300 841H344" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1120 841H1164" fill="none" stroke="#76adf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="80" y="926" font-size="18" font-weight="400" fill="#9badc2">Queue/task transitions are cooperative asyncio work; they are not one OS-thread switch per stage.</text>
<text x="56" y="995" font-size="18" font-weight="400" fill="#e4edf8">All three include input construction, immutable transformations, output validation and native acknowledgment.</text>
<text x="56" y="1027" font-size="17" font-weight="400" fill="#9badc2">The topology explains cost boundaries. Cross-framework timings do not isolate the gain from any one mechanism.</text>
<path d="M56 1057H1384" fill="none" stroke="#9badc2" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="1085" font-size="14" font-weight="400" fill="#9badc2">04 / Source links, profiles and trade-offs: docs/performance.md</text>
<text x="1384" y="1085" font-size="14" font-weight="400" fill="#9badc2" text-anchor="end">Selected adapters · not whole-framework rankings</text>
</g>
</svg>
