<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" aria-labelledby="title desc" role="img" viewBox="0 0 1440 1130"><title id="title">OminiCat — Three frameworks, three execution paths</title><desc id="desc">OminiCat uses one session FIFO then same-worker synchronous calls. Camel uses one SEDA queue, Exchange copy and route processors, with completion acknowledgment. Pipecat uses queued application processors with two queues and two processing tasks per stage; source and sink use direct mode. Different native acknowledgment paths remain in measured whole-loop throughput. This is a source-backed topology, not an optimization ablation.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e28"/><stop offset="1" stop-color="#0b1220"/></linearGradient><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6a91a8" opacity=".13"/></pattern><marker id="arrow-teal" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-blue" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-amber" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker><marker id="arrow-muted" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M1 1L7 4L1 7"/></marker></defs><rect width="1440" height="100%" fill="url(#background)" rx="22"/><rect width="1440" height="100%" fill="url(#dots)" rx="22"/><g font-family="Arial,Helvetica,DejaVu Sans,sans-serif"><text x="56" y="55" fill="#64d8c3" font-size="14" font-weight="700" letter-spacing="2">OMINICAT / ARCHITECTURE</text><text x="1384" y="55" fill="#9badc2" font-size="14" font-weight="400" letter-spacing="2" text-anchor="end">04 / COMPARED PATHS</text><text x="56" y="111" fill="#e4edf8" font-size="40" font-weight="700">Three frameworks, three execution paths</text><text x="56" y="150" fill="#9badc2" font-size="19" font-weight="400">The actual synchronous numeric adapters: native queued APIs, one outstanding frame.</text><rect width="1328" height="64" x="56" y="190" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="229" fill="#64d8c3" font-size="14" font-weight="700">PINNED MODES</text><text x="260" y="229" fill="#e4edf8" font-size="20" font-weight="400">Java 17 platform workers / CPython 3.12 asyncio / N = 1, 4, 16</text><rect width="1328" height="182" x="56" y="286" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="322" fill="#64d8c3" font-size="26" font-weight="700">OminiCat</text><text x="342" y="322" fill="#9badc2" font-size="19" font-weight="400">PipelineSession · one owner for the synchronous chain</text><rect width="160" height="55" x="80" y="347" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="96" y="382" fill="#e4edf8" font-size="19" font-weight="700">Input frame</text><rect width="190" height="55" x="284" y="347" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="300" y="382" fill="#e4edf8" font-size="19" font-weight="700">Session FIFO</text><rect width="502" height="55" x="518" y="347" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="534" y="382" fill="#e4edf8" font-size="19" font-weight="700">Worker: P1 → P2 → … → PN</text><rect width="296" height="55" x="1064" y="347" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="1080" y="382" fill="#e4edf8" font-size="19" font-weight="700">Terminal + ack</text><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M240 375H284"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M474 375H518"/><path fill="none" stroke="#64d8c3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-teal)" d="M1020 375H1064"/><text x="80" y="443" fill="#9badc2" font-size="18" font-weight="400">No queue between synchronous stages. Generation checks, scoped sinks and allocations remain.</text><rect width="1328" height="182" x="56" y="500" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="536" fill="#e9b96e" font-size="26" font-weight="700">Apache Camel 4.22.2</text><text x="440" y="536" fill="#9badc2" font-size="19" font-weight="400">One SEDA ingress · general Exchange / route machinery</text><rect width="238" height="55" x="80" y="561" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="96" y="596" fill="#e4edf8" font-size="19" font-weight="700">Request + Exchange</text><rect width="190" height="55" x="362" y="561" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="378" y="596" fill="#e4edf8" font-size="19" font-weight="700">SEDA queue</text><rect width="424" height="55" x="596" y="561" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="612" y="596" fill="#e4edf8" font-size="19" font-weight="700">Route: P1 → P2 → … → PN</text><rect width="296" height="55" x="1064" y="561" fill="#142536" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="1080" y="596" fill="#e4edf8" font-size="19" font-weight="700">Completion + reply</text><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-amber)" d="M318 589H362"/><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-amber)" d="M552 589H596"/><path fill="none" stroke="#e9b96e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-amber)" d="M1020 589H1064"/><text x="80" y="657" fill="#9badc2" font-size="18" font-weight="400">Exchange copy + request/reply synchronization per request; not one SEDA queue per stage.</text><rect width="1328" height="238" x="56" y="714" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><text x="80" y="750" fill="#76adf7" font-size="26" font-weight="700">Pipecat 1.15.0</text><text x="360" y="750" fill="#9badc2" font-size="19" font-weight="400">Queued application processors · enable_direct_mode=False</text><rect width="220" height="106" x="80" y="788" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="70" x="80" y="806" fill="#76adf7" rx="1.5"/><text x="102" y="822" fill="#e4edf8" font-size="19" font-weight="700">Worker input FIFO</text><text x="102" y="851" fill="#9badc2" font-size="16" font-weight="400">Native PipelineWorker</text><text x="102" y="876" fill="#9badc2" font-size="16" font-weight="400">Source / sink: direct</text><rect width="776" height="106" x="344" y="788" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="70" x="344" y="806" fill="#76adf7" rx="1.5"/><text x="366" y="822" fill="#e4edf8" font-size="21" font-weight="700">Application stage 1 → … → application stage N</text><text x="366" y="851" fill="#9badc2" font-size="17" font-weight="400">Each: input queue → input task → FrameQueue → process task</text><text x="366" y="876" fill="#9badc2" font-size="17" font-weight="400">Native Frame + immutable numeric-payload adapter</text><rect width="196" height="106" x="1164" y="788" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2" rx="15"/><rect width="3" height="70" x="1164" y="806" fill="#76adf7" rx="1.5"/><text x="1186" y="822" fill="#e4edf8" font-size="19" font-weight="700">Output event</text><text x="1186" y="851" fill="#9badc2" font-size="14" font-weight="400">Async event handler</text><text x="1186" y="876" fill="#9badc2" font-size="14" font-weight="400">Caller acknowledgment</text><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M300 841H344"/><path fill="none" stroke="#76adf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow-blue)" d="M1120 841H1164"/><text x="80" y="926" fill="#9badc2" font-size="18" font-weight="400">Queue/task transitions are cooperative asyncio work; they are not one OS-thread switch per stage.</text><text x="56" y="995" fill="#e4edf8" font-size="18" font-weight="400">All three include input construction, immutable transformations, output validation and native acknowledgment.</text><text x="56" y="1027" fill="#9badc2" font-size="17" font-weight="400">The topology explains cost boundaries. Cross-framework timings do not isolate the gain from any one mechanism.</text><path fill="none" stroke="#9badc2" stroke-linecap="round" stroke-linejoin="round" stroke-width=".6" d="M56 1057H1384"/><text x="56" y="1085" fill="#9badc2" font-size="14" font-weight="400">04 / Source links, profiles and trade-offs: docs/performance.md</text><text x="1384" y="1085" fill="#9badc2" font-size="14" font-weight="400" text-anchor="end">Selected adapters · not whole-framework rankings</text></g></svg>