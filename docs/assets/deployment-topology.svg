<text x="56" y="111" font-size="40" font-weight="700" fill="#e4edf8">Deploy around session ownership</text>
<text x="56" y="150" font-size="19" font-weight="400" fill="#9badc2">A shared application edge, independent runtime instances and optional model services.</text>
