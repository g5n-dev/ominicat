<text x="78" y="711" font-size="18" font-weight="400" fill="#9badc2">A reconnect creates a fresh session.</text>
<rect x="720" y="648" width="664" height="100" rx="15" fill="#111d2e" stroke="#2a3f53" stroke-width="1.2"/>
