<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
<title id="title">OminiCat — Deploy around session ownership</title>
<desc id="desc">A browser or client connects over HTTPS or WSS to an application gateway that terminates TLS and owns identity, routing and quotas. The gateway routes HTTP and WebSocket connections to independent OminiCat instances A and B. Each instance owns session-local pipelines, queues, workers and state, and calls configured external model services over HTTPS. Reconnecting creates a fresh session; persistence and recovery require application integration.</desc>
