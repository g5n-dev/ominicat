name: Model-free framework comparison
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'comparison/**'
      - 'ominicat-core/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'scripts/package_profiles.py'
      - 'scripts/summarize_profiles.py'
      - '.github/actions/framework-comparison/**'
      - '.github/workflows/framework-comparison.yml'
  push:
    branches: [main]
    paths:
      - 'comparison/**'
      - 'ominicat-core/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'scripts/package_profiles.py'
      - 'scripts/summarize_profiles.py'
      - '.github/actions/framework-comparison/**'
      - '.github/workflows/framework-comparison.yml'
permissions:
  contents: read
concurrency:
  group: framework-comparison-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ubuntu:
    name: Ubuntu 24.04 / Java 17
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: comparison/requirements.lock
      - name: Install native audio and font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libgomp1 fontconfig fonts-dejavu-core
      - uses: ./.github/actions/framework-comparison
        with:
          target: ubuntu-24.04
          distro-id: ubuntu
          distro-version: '24.04'
          python: python
  centos:
    name: CentOS Stream 9 userspace / Java 17
    runs-on: ubuntu-24.04
    container: quay.io/centos/centos:stream9@sha256:6f8045fc4f552544d8a401d61848bafc8d06ca7c11897c5b54a2c37fc419a20a
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native CentOS build and runtime tools
        run: |
          dnf install -y git-core curl-minimal tar gzip unzip findutils which ca-certificates python3.12 python3.12-pip java-17-openjdk-devel libsndfile libgomp libstdc++ fontconfig dejavu-sans-fonts
          java_home="$(dirname "$(dirname "$(readlink -f /usr/bin/javac)")")"
          test -x "$java_home/bin/jfr"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - name: Trust only this mounted checkout for container shell Git commands
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
          git status --porcelain
      - uses: ./.github/actions/framework-comparison
        with:
          target: centos-stream-9
          distro-id: centos
          distro-version: '9'
          python: python3.12
          container-image: quay.io/centos/centos:stream9@sha256:6f8045fc4f552544d8a401d61848bafc8d06ca7c11897c5b54a2c37fc419a20a
