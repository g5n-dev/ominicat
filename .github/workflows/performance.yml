name: Performance evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: scripts/profile.sh full reports/local/ci
      - uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: reports/local/ci/
