name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, coverage and dependency inventory
        run: ./mvnw -B -Pcoverage,sbom verify
      - name: Verify runnable distribution
        run: |
          java -jar ominicat-server/target/ominicat-server.jar --config config/demo.yaml > /tmp/ominicat.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/ominicat.log
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
            target/bom.*
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Whitespace and shell syntax
        run: |
          git show --format= --check HEAD
          bash -n scripts/profile.sh
