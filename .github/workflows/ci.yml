name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, coverage and dependency inventory
        run: ./mvnw -B -Pcoverage,sbom -Dominicat.stress.seeds=512 verify
      - name: Verify runnable distribution
        run: |
          java -jar ominicat-server/target/ominicat-server.jar --config config/demo.yaml > /tmp/ominicat.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/ominicat.log
          exit 1
      - name: Compile and smoke-test sustained-validation tooling
        run: |
          mkdir -p /tmp/ominicat-validation-classes
          javac --release 17 -cp ominicat-server/target/ominicat-server.jar -d /tmp/ominicat-validation-classes validation/*.java
          java -Xmx256m -XX:MaxDirectMemorySize=128m -cp ominicat-server/target/ominicat-server.jar:/tmp/ominicat-validation-classes ValidationServer validation/soak.yaml 18082 > /tmp/ominicat-validation.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/ominicat-validation.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health; then break; fi
            sleep 1
          done
          java -Xmx256m -cp ominicat-server/target/ominicat-server.jar:/tmp/ominicat-validation-classes Soak http://127.0.0.1:18081 http://127.0.0.1:18082 10 2 4 reports/local/ci-soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
            target/bom.*
            reports/local/ci-soak/
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Whitespace and shell syntax
        run: |
          git show --format= --check HEAD
          bash -n scripts/profile.sh scripts/server_soak.sh
      - name: Performance evidence failure controls
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Browser console syntax and lifecycle controls
        run: |
          node --check ominicat-server/src/main/resources/web/console.js
          node --test scripts/test_console.cjs
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root distribution
        run: docker build -t ominicat:ci .
      - name: Check container lifecycle and authentication
        run: |
          docker run --detach --name ominicat-ci -p 127.0.0.1:18080:8080 -e OMINICAT_TOKEN=synthetic-ci-token ominicat:ci
          trap 'docker logs ominicat-ci; docker rm --force ominicat-ci' EXIT
          test "$(docker exec ominicat-ci id -u)" != 0
          runtime_version="$(docker exec ominicat-ci java -version 2>&1)"
          printf '%s\n' "$runtime_version"
          [[ "$runtime_version" == *'version "17.'* ]]
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/metrics)" = 401
          curl --fail --silent -H 'Authorization: Bearer synthetic-ci-token' http://127.0.0.1:18080/metrics
